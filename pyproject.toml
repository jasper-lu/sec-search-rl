[project]
name = "sec-search-rl"
version = "0.1.0"
description = "RL a search agent on the Harness-1 SEC filing retrieval task with Tinker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jasper Lu" }]
dependencies = [
    "chz==0.4.0",
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.4",
    "regex==2026.7.19",
    "tinker==0.25.0",
    "tinker-cookbook==0.5.4",
    "wandb==0.28.2",
]

[project.scripts]
sec-rl = "sec_rl.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_rl"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
